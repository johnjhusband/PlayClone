# GitLab CI/CD Pipeline for PlayClone
# Comprehensive pipeline for testing, building, and deploying

variables:
  NODE_VERSION: "20"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

stages:
  - prepare
  - test
  - build
  - security
  - deploy
  - release

# Cache configuration
.cache_template: &cache_config
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull

# Install dependencies
install:dependencies:
  stage: prepare
  image: node:${NODE_VERSION}-slim
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright install-deps
    - npx playwright install chromium firefox webkit
  artifacts:
    paths:
      - node_modules/
      - ~/.cache/ms-playwright/
    expire_in: 1 hour
  cache:
    <<: *cache_config
    policy: pull-push

# Lint code
lint:code:
  stage: test
  image: node:${NODE_VERSION}-slim
  needs: ["install:dependencies"]
  script:
    - npm run lint
  allow_failure: false

# Type checking
typecheck:
  stage: test
  image: node:${NODE_VERSION}-slim
  needs: ["install:dependencies"]
  script:
    - npm run typecheck
  allow_failure: false

# Unit tests
test:unit:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  needs: ["install:dependencies"]
  script:
    - npm run test:unit
  coverage: '/Lines\s*:\s*([0-9.]+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: test-results/junit.xml
    paths:
      - coverage/
    expire_in: 1 week

# Integration tests
test:integration:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  needs: ["install:dependencies"]
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379"
    PLAYCLONE_HEADLESS: "true"
  script:
    - npm run test:integration
  artifacts:
    paths:
      - test-results/
      - screenshots/
    expire_in: 1 week
    when: always

# Browser compatibility tests
test:browsers:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  needs: ["install:dependencies"]
  parallel:
    matrix:
      - BROWSER: [chromium, firefox, webkit]
  script:
    - npm run test:browser -- --browser=$BROWSER
  artifacts:
    paths:
      - test-results/$BROWSER/
    expire_in: 1 week
    when: always

# Performance tests
test:performance:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  needs: ["install:dependencies"]
  script:
    - npm run test:performance
  artifacts:
    reports:
      performance: performance-results/report.json
    paths:
      - performance-results/
    expire_in: 1 week
  only:
    - main
    - develop
    - schedules

# Build application
build:app:
  stage: build
  image: node:${NODE_VERSION}-slim
  needs: ["lint:code", "typecheck", "test:unit"]
  script:
    - npm run build
    - npm pack
  artifacts:
    paths:
      - dist/
      - playclone-*.tgz
    expire_in: 1 week

# Build Docker image
build:docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  needs: ["build:app"]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
    - tags

# Security scanning - Dependencies
security:dependencies:
  stage: security
  image: node:${NODE_VERSION}-slim
  needs: ["install:dependencies"]
  script:
    - npm audit --audit-level=high
  allow_failure: true

# Security scanning - Docker image
security:container:
  stage: security
  image: aquasec/trivy:latest
  needs: ["build:docker"]
  services:
    - docker:24-dind
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  allow_failure: true
  only:
    - main
    - develop

# SAST - Static Application Security Testing
security:sast:
  stage: security
  image: returntocorp/semgrep:latest
  needs: ["build:app"]
  script:
    - semgrep --config=auto --json -o sast-report.json src/
  artifacts:
    reports:
      sast: sast-report.json
    expire_in: 1 week
  allow_failure: true

# Deploy to staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  needs: ["build:docker", "test:integration"]
  environment:
    name: staging
    url: https://staging.playclone.example.com
  before_script:
    - apk add --no-cache curl openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | ssh-add -
  script:
    - ssh $STAGING_USER@$STAGING_HOST "docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - ssh $STAGING_USER@$STAGING_HOST "docker stop playclone-staging || true"
    - ssh $STAGING_USER@$STAGING_HOST "docker rm playclone-staging || true"
    - ssh $STAGING_USER@$STAGING_HOST "docker run -d --name playclone-staging -p 3000:3000 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - sleep 10
    - curl -f https://staging.playclone.example.com/health || exit 1
  only:
    - develop
  when: manual

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  needs: ["build:docker", "test:integration", "security:container"]
  environment:
    name: production
    url: https://playclone.example.com
  before_script:
    - apk add --no-cache curl openssh-client kubectl
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_KEY" | ssh-add -
  script:
    # Rolling deployment with Kubernetes
    - kubectl set image deployment/playclone playclone=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --record
    - kubectl rollout status deployment/playclone
    - curl -f https://playclone.example.com/health || exit 1
  only:
    - main
    - tags
  when: manual

# Publish to NPM
release:npm:
  stage: release
  image: node:${NODE_VERSION}-slim
  needs: ["build:app", "test:integration", "security:dependencies"]
  before_script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
  script:
    - npm publish playclone-*.tgz
  only:
    - tags
  when: manual

# Create GitHub release
release:github:
  stage: release
  image: alpine:latest
  needs: ["build:app", "test:integration"]
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      RELEASE_DATA="{
        \"tag_name\": \"$CI_COMMIT_TAG\",
        \"name\": \"PlayClone $CI_COMMIT_TAG\",
        \"body\": \"Release $CI_COMMIT_TAG\",
        \"draft\": false,
        \"prerelease\": false
      }"
    - |
      curl -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "$RELEASE_DATA" \
        https://api.github.com/repos/$GITHUB_REPO/releases
  only:
    - tags
  when: manual

# Nightly build
nightly:build:
  stage: build
  extends: build:docker
  variables:
    DOCKER_TAG_SUFFIX: "-nightly"
  only:
    - schedules
  script:
    - docker build -t $CI_REGISTRY_IMAGE:nightly-$CI_PIPELINE_ID .
    - docker tag $CI_REGISTRY_IMAGE:nightly-$CI_PIPELINE_ID $CI_REGISTRY_IMAGE:nightly-latest
    - docker push $CI_REGISTRY_IMAGE:nightly-$CI_PIPELINE_ID
    - docker push $CI_REGISTRY_IMAGE:nightly-latest

# Cleanup old artifacts
cleanup:artifacts:
  stage: .post
  image: alpine:latest
  script:
    - echo "Cleaning up old artifacts"
  when: always
  only:
    - schedules