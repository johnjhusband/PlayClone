apiVersion: v1
kind: Service
metadata:
  name: playclone-farm
  namespace: playclone
  labels:
    app: playclone
    component: farm
spec:
  type: LoadBalancer
  selector:
    app: playclone
    component: farm
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: playclone-worker
  namespace: playclone
  labels:
    app: playclone
    component: worker
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: playclone
    component: worker
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: worker