<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayClone Step Debugger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #2d2d30;
            padding: 10px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #3e3e42;
        }

        .toolbar button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .toolbar button:hover {
            background: #1177bb;
        }

        .toolbar button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }

        .toolbar button.danger {
            background: #a1260d;
        }

        .toolbar button.danger:hover {
            background: #c42a1c;
        }

        .status-bar {
            background: #007acc;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-indicator.paused {
            color: #ff9800;
        }

        .status-indicator.running {
            color: #4caf50;
        }

        .steps-panel {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .step-item {
            padding: 10px;
            margin-bottom: 5px;
            background: #2d2d30;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .step-item:hover {
            background: #3e3e42;
        }

        .step-item.current {
            background: #094771;
            border-left: 3px solid #007acc;
        }

        .step-item.success {
            border-left: 3px solid #4caf50;
        }

        .step-item.error {
            border-left: 3px solid #f44336;
        }

        .step-item.running {
            border-left: 3px solid #ff9800;
        }

        .step-number {
            color: #858585;
            font-size: 12px;
            min-width: 30px;
        }

        .step-type {
            background: #007acc;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .step-description {
            flex: 1;
            font-size: 13px;
        }

        .step-duration {
            color: #858585;
            font-size: 11px;
        }

        .breakpoint-indicator {
            position: absolute;
            left: -8px;
            width: 12px;
            height: 12px;
            background: #e51400;
            border-radius: 50%;
            border: 1px solid #1e1e1e;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            background: #2d2d30;
            display: flex;
            border-bottom: 1px solid #3e3e42;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 14px;
        }

        .tab:hover {
            background: #3e3e42;
        }

        .tab.active {
            border-bottom-color: #007acc;
            background: #1e1e1e;
        }

        .tab-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .screenshot-container {
            background: #2d2d30;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .screenshot-container img {
            max-width: 100%;
            border-radius: 4px;
        }

        .watch-panel {
            background: #252526;
            border-top: 1px solid #3e3e42;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .watch-item {
            display: flex;
            gap: 10px;
            padding: 5px;
            margin-bottom: 5px;
            background: #2d2d30;
            border-radius: 3px;
            font-size: 13px;
        }

        .watch-expression {
            color: #9cdcfe;
            flex: 1;
        }

        .watch-value {
            color: #ce9178;
        }

        .watch-error {
            color: #f44336;
        }

        .console-panel {
            background: #1e1e1e;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            max-height: 300px;
        }

        .console-entry {
            margin-bottom: 5px;
            display: flex;
            gap: 10px;
        }

        .console-timestamp {
            color: #858585;
        }

        .console-type {
            font-weight: bold;
        }

        .console-type.log { color: #d4d4d4; }
        .console-type.warn { color: #ff9800; }
        .console-type.error { color: #f44336; }
        .console-type.info { color: #2196f3; }

        .performance-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .metric-card {
            background: #2d2d30;
            padding: 15px;
            border-radius: 4px;
        }

        .metric-label {
            color: #858585;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #007acc;
        }

        .metric-unit {
            color: #858585;
            font-size: 14px;
        }

        .element-info {
            background: #2d2d30;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }

        .element-info pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2d2d30;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            background: #3e3e42;
            border: 1px solid #007acc;
            color: #d4d4d4;
            padding: 8px;
            border-radius: 4px;
        }

        .input-group button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Icons */
        .icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="toolbar">
            <h3>Steps</h3>
        </div>
        <div class="steps-panel" id="stepsPanel">
            <!-- Steps will be populated here -->
        </div>
        <div class="watch-panel" id="watchPanel">
            <h4>Watch Expressions</h4>
            <!-- Watch expressions will be populated here -->
        </div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <button id="continueBtn" onclick="sendCommand('continue')">
                ▶️ Continue
            </button>
            <button id="stepOverBtn" onclick="sendCommand('stepOver')">
                ⏭️ Step Over
            </button>
            <button id="stepIntoBtn" onclick="sendCommand('stepInto')">
                ⬇️ Step Into
            </button>
            <button id="stepOutBtn" onclick="sendCommand('stepOut')">
                ⬆️ Step Out
            </button>
            <button id="pauseBtn" onclick="sendCommand('pause')">
                ⏸️ Pause
            </button>
            <button class="danger" onclick="sendCommand('stop')">
                ⏹️ Stop
            </button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('preview')">Preview</div>
            <div class="tab" onclick="switchTab('console')">Console</div>
            <div class="tab" onclick="switchTab('element')">Element Info</div>
            <div class="tab" onclick="switchTab('performance')">Performance</div>
            <div class="tab" onclick="switchTab('breakpoints')">Breakpoints</div>
        </div>

        <div class="content-area">
            <div class="tab-content" id="previewTab">
                <div class="screenshot-container">
                    <img id="screenshotImg" src="" alt="Page screenshot">
                </div>
            </div>

            <div class="tab-content" id="consoleTab" style="display: none;">
                <div class="console-panel" id="consolePanel">
                    <!-- Console logs will be populated here -->
                </div>
            </div>

            <div class="tab-content" id="elementTab" style="display: none;">
                <div class="element-info" id="elementInfo">
                    <pre>No element selected</pre>
                </div>
            </div>

            <div class="tab-content" id="performanceTab" style="display: none;">
                <div class="performance-panel" id="performancePanel">
                    <div class="metric-card">
                        <div class="metric-label">CPU Time</div>
                        <div class="metric-value" id="cpuMetric">0<span class="metric-unit">ms</span></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Memory Used</div>
                        <div class="metric-value" id="memoryMetric">0<span class="metric-unit">MB</span></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Network Requests</div>
                        <div class="metric-value" id="requestsMetric">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Data Transferred</div>
                        <div class="metric-value" id="dataMetric">0<span class="metric-unit">KB</span></div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="breakpointsTab" style="display: none;">
                <div class="input-group">
                    <input type="text" id="breakpointInput" placeholder="Enter step index or selector">
                    <button onclick="addBreakpoint()">Add Breakpoint</button>
                </div>
                <div id="breakpointsList">
                    <!-- Breakpoints will be listed here -->
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator">
                <span class="spinner" style="display: none;"></span>
                <span id="statusText">Ready</span>
            </div>
            <div>Step: <span id="currentStep">0</span> / <span id="totalSteps">0</span></div>
            <div>URL: <span id="currentUrl">-</span></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <input type="text" id="evalInput" placeholder="Evaluate expression...">
            <button onclick="evaluateExpression()">Eval</button>
        </div>
        <div class="input-group">
            <input type="text" id="watchInput" placeholder="Add watch expression...">
            <button onclick="addWatch()">Watch</button>
        </div>
    </div>

    <script>
        let ws = null;
        let debugContext = {};
        let currentTab = 'preview';

        // Initialize WebSocket connection
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('Connected to debugger');
                updateStatus('Connected', 'running');
                requestContext();
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Connection error', 'error');
            };

            ws.onclose = () => {
                console.log('Disconnected from debugger');
                updateStatus('Disconnected', 'paused');
                setTimeout(initWebSocket, 3000); // Reconnect after 3 seconds
            };
        }

        // Handle incoming messages
        function handleMessage(message) {
            switch (message.type) {
                case 'context':
                    updateContext(message.data);
                    break;
                case 'paused':
                    updateStatus(`Paused: ${message.reason}`, 'paused');
                    updateButtons(true);
                    break;
                case 'resumed':
                    updateStatus('Running', 'running');
                    updateButtons(false);
                    break;
                case 'step-started':
                    updateCurrentStep(message.step);
                    break;
                case 'step-completed':
                    updateStepStatus(message.step);
                    break;
                case 'step-error':
                    updateStepError(message.step, message.error);
                    break;
                case 'watches-updated':
                    updateWatches(message.watches);
                    break;
                case 'console':
                    addConsoleEntry(message);
                    break;
                case 'screenshot':
                    updateScreenshot(message.data);
                    break;
                case 'eval-result':
                    showEvalResult(message.result);
                    break;
            }
        }

        // Send command to debugger
        function sendCommand(command, params = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command, ...params }));
            }
        }

        // Request current context
        function requestContext() {
            sendCommand('getContext');
        }

        // Update debug context
        function updateContext(context) {
            debugContext = context;
            
            // Update UI
            document.getElementById('currentStep').textContent = context.currentStep + 1;
            document.getElementById('totalSteps').textContent = context.totalSteps;
            document.getElementById('currentUrl').textContent = context.pageInfo?.url || '-';
            
            // Update steps panel
            updateStepsPanel(context.steps);
            
            // Update other panels
            updateWatchPanel(context.watches);
            updateBreakpointsPanel(context.breakpoints);
            updatePerformancePanel(context.performance);
        }

        // Update steps panel
        function updateStepsPanel(steps) {
            const panel = document.getElementById('stepsPanel');
            panel.innerHTML = '';
            
            steps.forEach((step, index) => {
                const div = document.createElement('div');
                div.className = `step-item ${step.status}`;
                if (index === debugContext.currentStep) {
                    div.className += ' current';
                }
                
                // Check for breakpoint
                const hasBreakpoint = debugContext.breakpoints?.some(bp => bp.stepIndex === index);
                if (hasBreakpoint) {
                    const bp = document.createElement('div');
                    bp.className = 'breakpoint-indicator';
                    div.appendChild(bp);
                }
                
                div.innerHTML = `
                    <span class="step-number">${index + 1}</span>
                    <span class="step-type">${step.type}</span>
                    <span class="step-description">${step.description}</span>
                    ${step.duration ? `<span class="step-duration">${step.duration}ms</span>` : ''}
                `;
                
                div.onclick = () => selectStep(index);
                panel.appendChild(div);
            });
        }

        // Select a step
        function selectStep(index) {
            const step = debugContext.steps[index];
            if (step) {
                // Update element info
                if (step.elementInfo) {
                    document.getElementById('elementInfo').innerHTML = `<pre>${JSON.stringify(step.elementInfo, null, 2)}</pre>`;
                }
                
                // Update screenshot if available
                if (step.screenshot) {
                    document.getElementById('screenshotImg').src = step.screenshot;
                }
            }
        }

        // Update watch panel
        function updateWatchPanel(watches) {
            const panel = document.getElementById('watchPanel');
            const watchesHtml = watches?.map(watch => `
                <div class="watch-item">
                    <span class="watch-expression">${watch.expression}</span>
                    ${watch.error 
                        ? `<span class="watch-error">${watch.error}</span>`
                        : `<span class="watch-value">${JSON.stringify(watch.value)}</span>`
                    }
                </div>
            `).join('') || '<div style="color: #858585;">No watch expressions</div>';
            
            panel.innerHTML = '<h4>Watch Expressions</h4>' + watchesHtml;
        }

        // Update breakpoints panel
        function updateBreakpointsPanel(breakpoints) {
            const list = document.getElementById('breakpointsList');
            if (!list) return;
            
            const bpsHtml = breakpoints?.map(bp => `
                <div class="breakpoint-item">
                    ${bp.enabled ? '🔴' : '⚫'} 
                    ${bp.stepIndex !== undefined ? `Step ${bp.stepIndex}` : ''}
                    ${bp.selector ? `Selector: ${bp.selector}` : ''}
                    ${bp.url ? `URL: ${bp.url}` : ''}
                    (Hit ${bp.hitCount} times)
                    <button onclick="removeBreakpoint('${bp.id}')">Remove</button>
                </div>
            `).join('') || '<div style="color: #858585;">No breakpoints set</div>';
            
            list.innerHTML = bpsHtml;
        }

        // Update performance panel
        function updatePerformancePanel(performance) {
            if (!performance || performance.length === 0) return;
            
            const latest = performance[performance.length - 1][1];
            document.getElementById('cpuMetric').innerHTML = `${latest.cpu}<span class="metric-unit">ms</span>`;
            document.getElementById('memoryMetric').innerHTML = `${(latest.memory / 1024 / 1024).toFixed(2)}<span class="metric-unit">MB</span>`;
            document.getElementById('requestsMetric').textContent = latest.network.requests;
            document.getElementById('dataMetric').innerHTML = `${((latest.network.bytesReceived + latest.network.bytesSent) / 1024).toFixed(2)}<span class="metric-unit">KB</span>`;
        }

        // Update status
        function updateStatus(text, type) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            indicator.className = `status-indicator ${type}`;
            statusText.textContent = text;
            
            // Show/hide spinner
            const spinner = indicator.querySelector('.spinner');
            spinner.style.display = type === 'running' ? 'inline-block' : 'none';
        }

        // Update buttons
        function updateButtons(paused) {
            document.getElementById('continueBtn').disabled = !paused;
            document.getElementById('stepOverBtn').disabled = !paused;
            document.getElementById('stepIntoBtn').disabled = !paused;
            document.getElementById('stepOutBtn').disabled = !paused;
            document.getElementById('pauseBtn').disabled = paused;
        }

        // Switch tabs
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.textContent.toLowerCase().includes(tab));
            });
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => {
                c.style.display = 'none';
            });
            document.getElementById(`${tab}Tab`).style.display = 'block';
        }

        // Add breakpoint
        function addBreakpoint() {
            const input = document.getElementById('breakpointInput');
            const value = input.value.trim();
            
            if (value) {
                const stepIndex = parseInt(value);
                if (!isNaN(stepIndex)) {
                    sendCommand('setBreakpoint', { breakpoint: { stepIndex, enabled: true } });
                } else {
                    sendCommand('setBreakpoint', { breakpoint: { selector: value, enabled: true } });
                }
                input.value = '';
            }
        }

        // Remove breakpoint
        function removeBreakpoint(id) {
            sendCommand('removeBreakpoint', { id });
        }

        // Add watch expression
        function addWatch() {
            const input = document.getElementById('watchInput');
            const expression = input.value.trim();
            
            if (expression) {
                sendCommand('addWatch', { expression });
                input.value = '';
            }
        }

        // Evaluate expression
        function evaluateExpression() {
            const input = document.getElementById('evalInput');
            const expression = input.value.trim();
            
            if (expression) {
                sendCommand('evaluate', { expression });
                input.value = '';
            }
        }

        // Show eval result
        function showEvalResult(result) {
            addConsoleEntry({
                type: 'console',
                level: 'log',
                text: `> ${JSON.stringify(result)}`,
                timestamp: Date.now()
            });
        }

        // Add console entry
        function addConsoleEntry(entry) {
            const panel = document.getElementById('consolePanel');
            const div = document.createElement('div');
            div.className = 'console-entry';
            
            const time = new Date(entry.timestamp).toLocaleTimeString();
            div.innerHTML = `
                <span class="console-timestamp">${time}</span>
                <span class="console-type ${entry.level}">${entry.level.toUpperCase()}</span>
                <span>${entry.text}</span>
            `;
            
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
        }

        // Update screenshot
        function updateScreenshot(data) {
            document.getElementById('screenshotImg').src = data;
        }

        // Initialize on load
        window.onload = () => {
            initWebSocket();
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F5') {
                e.preventDefault();
                sendCommand('continue');
            } else if (e.key === 'F10') {
                e.preventDefault();
                sendCommand('stepOver');
            } else if (e.key === 'F11') {
                e.preventDefault();
                sendCommand('stepInto');
            } else if (e.shiftKey && e.key === 'F11') {
                e.preventDefault();
                sendCommand('stepOut');
            } else if (e.key === 'F8') {
                e.preventDefault();
                sendCommand(debugContext.isPaused ? 'continue' : 'pause');
            }
        });
    </script>
</body>
</html>
